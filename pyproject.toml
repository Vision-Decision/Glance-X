[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glancex"
version = "0.3.0"
description = "Glance-X-Lite: find any object from a text request, image-first or text-first (0.8B)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=5.9",
  "peft>=0.15",
  "pillow",
  "numpy",
  "safetensors",
  "huggingface_hub",
]

[project.optional-dependencies]
fla = ["flash-linear-attention"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/Vision-Decision/Glance-X"
Weights = "https://huggingface.co/Vision-Decision/Glance-X-Lite"
Training = "https://github.com/Vision-Decision/Glanece-Training"
Data = "https://github.com/Vision-Decision/Glance-COCO"

[tool.setuptools]
packages = ["glancex"]

[tool.ruff]
line-length = 145
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E401", "E701", "E702", "E731", "E741", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
